<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌐 联机大厅 · 坦克大战</title>
<style>
:root{--panel:#16213e;--gold:#f0c040;--text:#e8eaf2;--text2:#98a0bd;--green:#27ae60;--red:#e94560;--border:#2c3a60;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -10%,#26305c 0%,#141a33 45%,#080a14 100%);color:var(--text);min-height:100vh;padding:16px;}
.container{max-width:900px;margin:0 auto;}
h1{font-size:1.4rem;color:var(--gold);text-align:center;letter-spacing:2px;margin-bottom:16px;}
h2{font-size:1rem;color:var(--gold);letter-spacing:1px;margin:14px 0 8px;}
input{width:100%;padding:10px 14px;border-radius:8px;border:2px solid var(--border);background:#121a30;color:var(--text);outline:none;font-family:inherit;font-size:.95rem;}
input:focus{border-color:var(--gold);}
button{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.9rem;font-family:inherit;transition:transform .15s;}
button:active{transform:scale(.96);}
.btn-gold{background:linear-gradient(160deg,#ffd45e,#e0a91a);color:#1a1a2e;}
.btn-blue{background:linear-gradient(160deg,#63b6ff,#2b7fd4);color:#fff;}
.btn-red{background:linear-gradient(160deg,#ff5b74,#c62a44);color:#fff;}
.btn-outline{background:rgba(255,255,255,.05);border:2px solid #6b7699;color:#cfd6ea;}
.btn-outline:hover{border-color:#fff;color:#fff;}
.btn-sm{padding:7px 12px;font-size:.78rem;}
.row{display:flex;gap:8px;margin-bottom:12px;}
.panel{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border);margin-bottom:14px;}
.room-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(10,16,36,.6);border-radius:8px;margin-bottom:8px;border:1px solid var(--border);}
.room-item .meta{flex:1;font-size:.85rem;}
.room-item .name{color:var(--gold);font-weight:700;font-size:.95rem;}
.room-item .sub{color:var(--text2);font-size:.72rem;margin-top:2px;}
.empty{text-align:center;color:var(--text2);padding:30px;font-size:.85rem;}
.tank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:280px;overflow-y:auto;padding:4px;}
.tank-card{background:#121a30;border:2px solid var(--border);border-radius:8px;padding:8px;text-align:center;cursor:pointer;font-size:.72rem;transition:all .2s;}
.tank-card:hover{border-color:#6b7699;transform:translateY(-2px);}
.tank-card.selected{border-color:var(--gold);background:rgba(240,192,64,.12);box-shadow:0 0 16px rgba(240,192,64,.4);}
.tank-card .tn{font-weight:700;color:var(--text);margin-bottom:2px;}
.tank-card .ts{color:var(--text2);font-size:.65rem;}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
.map-card{background:#121a30;border:2px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;text-align:center;font-size:.78rem;transition:all .2s;}
.map-card.selected{border-color:var(--gold);background:rgba(240,192,64,.12);}
.map-card .mn{font-weight:700;color:var(--text);}
.map-card .mt{color:var(--text2);font-size:.68rem;margin-top:2px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.85rem;}
.info-grid .k{color:var(--text2);}
.info-grid .v{color:var(--gold);font-weight:700;}
.status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;}
.status-selecting{background:rgba(240,192,64,.15);color:var(--gold);}
.status-playing{background:rgba(39,174,96,.15);color:var(--green);}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-100px);background:#1b2748;color:#fff;padding:12px 24px;border-radius:10px;font-weight:700;border:2px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.6);z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);max-width:80vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.err{border-color:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <button class="btn-outline btn-sm" onclick="goHome()">← 返回主菜单</button>
    <span style="color:var(--gold);font-weight:700;">👤 <span id="lobby-user">-</span></span>
  </div>
  <h1>🌐 联机大厅</h1>

  <!-- ============ 视图：大厅 ============ -->
  <div id="view-lobby">
    <div class="row">
      <button class="btn-gold" style="flex:1;" onclick="createRoom()">➕ 创建房间</button>
      <button class="btn-blue" style="flex:1;" onclick="joinByCode()">🔗 输入房间号加入</button>
    </div>
    <div class="panel">
      <h2 style="margin-top:0;">📋 房间列表（点击加入）</h2>
      <div id="room-list"><div class="empty">加载中...</div></div>
    </div>
  </div>

  <!-- ============ 视图：房间详情 ============ -->
  <div id="view-room" style="display:none;">
    <div class="panel">
      <h2 style="margin-top:0;">🎮 房间号：<span id="room-id-display" style="color:var(--gold);letter-spacing:4px;">-------</span></h2>
      <div class="info-grid">
        <div><span class="k">房主：</span><span class="v" id="room-host">-</span></div>
        <div><span class="k">对手：</span><span class="v" id="room-guest">-</span></div>
        <div><span class="k">状态：</span><span id="room-status" class="status-badge status-selecting">-</span></div>
        <div><span class="k">你的阵营：</span><span class="v" id="room-my-team">-</span></div>
      </div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0;">🎯 选择坦克</h2>
      <div id="tank-list" class="tank-grid"></div>
      <div id="my-tank-hint" style="margin-top:8px;font-size:.78rem;color:var(--text2);"></div>
    </div>

    <div id="host-panel" style="display:none;">
      <div class="panel">
        <h2 style="margin-top:0;">🗺️ 选择地图（房主）</h2>
        <div id="map-list" class="map-grid"></div>
      </div>
      <div class="row">
        <button class="btn-gold" style="flex:1;" id="btn-start" onclick="startBattle()" disabled>▶ 开始战斗</button>
        <button class="btn-outline" onclick="leaveRoom()">🚪 离开</button>
      </div>
    </div>
    <div id="guest-panel" style="display:none;">
      <div class="panel" style="text-align:center;color:var(--text2);font-size:.85rem;">
        ⏳ 等待房主开始战斗...<br><span style="font-size:.72rem;">（双方都选好坦克后房主即可开始）</span>
      </div>
      <button class="btn-outline" onclick="leaveRoom()">🚪 离开房间</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   配置
============================================================ */
const API = '';
let authToken = localStorage.getItem('tank_token') || null;
let currentUser = null;
let unlockedTanks = [];
let currentRoom = null;
let myTank = null;
let myMapId = null;
let pollTimer = null;

const ALL_TANKS = [
  {id:'basic',name:'普通坦克',hp:3,spd:2,rng:5,atk:1},
  {id:'water_ghost',name:'两栖战车',hp:2,spd:1,rng:3,atk:1},
  {id:'fast_tank',name:'快速坦克',hp:1.5,spd:4,rng:4,atk:1},
  {id:'armored_car',name:'装甲车',hp:2,spd:2,rng:4,atk:0.5},
  {id:'dm_car',name:'D.M.装甲车',hp:1.5,spd:2,rng:4,atk:0.5},
  {id:'heavy_tank',name:'重型坦克',hp:4,spd:1,rng:5,atk:2},
  {id:'apocalypse',name:'天启坦克',hp:2,spd:1,rng:4,atk:999},
  {id:'shield_tank',name:'护盾车',hp:2,spd:2,rng:4,atk:0.5},
  {id:'siege_tank',name:'攻城车',hp:5,spd:1,rng:1,atk:3},
  {id:'super_heavy',name:'超重型坦克',hp:6.5,spd:1,rng:3,atk:0.5},
  {id:'melee_tank',name:'近战坦克',hp:3,spd:3,rng:1,atk:2},
  {id:'flame_tank',name:'烈焰战车',hp:3,spd:2,rng:3,atk:0.5},
  {id:'digger_car',name:'钻地车',hp:2,spd:2,rng:1,atk:1},
  {id:'repair_tank',name:'维修坦克',hp:3,spd:2,rng:0,atk:0.5},
  {id:'engineer',name:'工程师',hp:1.5,spd:2,rng:0,atk:0},
  {id:'rocket_launcher',name:'火箭车',hp:2.5,spd:2,rng:0,atk:0},
  {id:'nuke_launcher',name:'核弹车',hp:2,spd:1,rng:0,atk:0},
  {id:'fire_tank',name:'焚火战车',hp:10,spd:1,rng:3,atk:0.5},
  {id:'nano_3',name:'纳米分裂战车',hp:0.5,spd:1,rng:3,atk:1},
  {id:'robot_plus',name:'机器人加强型',hp:0.5,spd:4,rng:1,atk:1},
  {id:'artillery_tank',name:'巨炮坦克',hp:4,spd:1,rng:5,atk:2},
  {id:'nano_repair',name:'纳米自动修复坦克',hp:2,spd:2,rng:5,atk:0.5}
];

const ALL_MAPS = [
  {id:'position_zero',name:'0号阵地',tags:'平衡 水战'},
  {id:'crossroads',name:'十字路口',tags:'复杂 跳板'},
  {id:'chu_han',name:'楚河汉界',tags:'水战 跳板'},
  {id:'twin_rivers',name:'双河对峙',tags:'水战 跳板'},
  {id:'island',name:'孤岛',tags:'水战 复杂'},
  {id:'stone_field',name:'石阵',tags:'攻坚 复杂'}
];

/* ============================================================
   工具
============================================================ */
const $ = id => document.getElementById(id);
function toast(msg, isErr) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body) headers['Content-Type'] = 'application/json';
  if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
  const res = await fetch(API + path, Object.assign({}, opts, { headers }));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function goHome() { window.location.href = 'index.html'; }

/* ============================================================
   启动
============================================================ */
async function boot() {
  if (!authToken) {
    toast('请先登录', true);
    setTimeout(goHome, 1500);
    return;
  }
  try {
    const me = await api('/api/auth/me');
    currentUser = me.user;
    unlockedTanks = me.unlockedTanks || [];
    $('lobby-user').textContent = currentUser.username;
    loadRoomList();
    setInterval(loadRoomList, 2500);
  } catch (e) {
    toast('登录已过期，请重新登录', true);
    setTimeout(goHome, 1500);
  }
}

/* ============================================================
   房间列表
============================================================ */
async function loadRoomList() {
  if (currentRoom) return;
  try {
    const data = await api('/api/online/list');
    const el = $('room-list');
    if (!data.rooms || !data.rooms.length) {
      el.innerHTML = '<div class="empty">暂无房间，点上方按钮创建一个吧</div>';
      return;
    }
    el.innerHTML = data.rooms.map(r => {
      const mapName = (ALL_MAPS.find(m => m.id === r.map_id) || {}).name || r.map_id || '-';
      return '<div class="room-item">' +
        '<div class="meta">' +
          '<div class="name">' + esc(r.host_name) + ' 的房间</div>' +
          '<div class="sub">房间号：' + esc(r.id) + ' · 地图：' + esc(mapName) + ' · ' + esc(r.created_at) + '</div>' +
        '</div>' +
        '<button class="btn-blue btn-sm" onclick="joinRoom(\'' + esc(r.id) + '\')">加入</button>' +
      '</div>';
    }).join('');
  } catch (e) {
    // 静默
  }
}

/* ============================================================
   创建 / 加入
============================================================ */
async function createRoom() {
  try {
    const data = await api('/api/online/create', { method: 'POST', body: '{}' });
    if (!data.success) { toast(data.error || '创建失败', true); return; }
    toast('房间已创建：' + data.roomId);
    enterRoom(data.roomId);
  } catch (e) { toast(e.message, true); }
}

async function joinRoom(roomId) {
  try {
    const data = await api('/api/online/join', { method: 'POST', body: JSON.stringify({ roomId }) });
    if (!data.success) { toast(data.error || '加入失败', true); return; }
    toast('已加入房间 ' + roomId);
    enterRoom(roomId);
  } catch (e) { toast(e.message, true); }
}

function joinByCode() {
  const id = prompt('请输入房间号：');
  if (!id) return;
  joinRoom(id.trim().toUpperCase());
}

/* ============================================================
   进入房间详情
============================================================ */
function enterRoom(roomId) {
  $('view-lobby').style.display = 'none';
  $('view-room').style.display = 'block';
  currentRoom = { id: roomId };
  myTank = null;
  myMapId = null;
  $('room-id-display').textContent = roomId;
  refreshRoom();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshRoom, 2000);
}

async function refreshRoom() {
  if (!currentRoom) return;
  try {
    const data = await api('/api/online/room?id=' + currentRoom.id);
    if (!data.room) { toast('房间已关闭', true); leaveRoom(true); return; }
    const room = data.room;
    currentRoom = room;

    $('room-host').textContent = room.host_name || '-';
    $('room-guest').textContent = room.guest_name || '（等待加入）';
    const stEl = $('room-status');
    const statusText = room.status === 'selecting' ? '选坦克中' : room.status === 'playing' ? '战斗中' : '已结束';
    stEl.textContent = statusText;
    stEl.className = 'status-badge status-' + room.status;

    const isHost = room.host_id === currentUser.id;
    $('room-my-team').textContent = isHost ? '🔴 红方' : '🔵 蓝方';

    // 战斗中 -> 跳转
    if (room.status === 'playing') {
      toast('战斗开始！');
      clearInterval(pollTimer);
      pollTimer = null;
      setTimeout(() => {
        window.location.href = 'index.html?online=1&room=' + encodeURIComponent(room.id);
      }, 600);
      return;
    }
    if (room.status === 'ended') {
      toast('房间已结束', true);
      leaveRoom(true);
      return;
    }

    // 自己的坦克
    if (isHost) myTank = room.host_tank;
    else myTank = room.guest_tank;
    if (isHost) myMapId = room.map_id;

    renderTankList(isHost);
    renderRoomControls(isHost, room);
  } catch (e) {
    // 静默
  }
}

function renderTankList(isHost) {
  const available = ALL_TANKS.filter(t => unlockedTanks.includes(t.id) || ['basic','armored_car'].includes(t.id));
  const el = $('tank-list');
  el.innerHTML = available.map(t =>
    '<div class="tank-card ' + (myTank === t.id ? 'selected' : '') + '" onclick="selectTank(\'' + t.id + '\')">' +
      '<div class="tn">' + t.name + '</div>' +
      '<div class="ts">❤' + t.hp + ' ⚡' + t.spd + ' 🎯' + t.rng + ' ⚔' + t.atk + '</div>' +
    '</div>'
  ).join('');
  $('my-tank-hint').textContent = myTank ? '✅ 已选择：' + (ALL_TANKS.find(t => t.id === myTank) || {}).name : '请选择你的出战坦克';
}

async function selectTank(tankId) {
  myTank = tankId;
  renderTankList(currentRoom.host_id === currentUser.id);
  try {
    const body = { roomId: currentRoom.id, tank: tankId };
    if (currentRoom.host_id === currentUser.id && myMapId) body.mapId = myMapId;
    await api('/api/online/select-tank', { method: 'POST', body: JSON.stringify(body) });
    toast('已选择：' + (ALL_TANKS.find(t => t.id === tankId) || {}).name);
  } catch (e) { toast(e.message, true); }
}

function renderRoomControls(isHost, room) {
  if (isHost) {
    $('host-panel').style.display = 'block';
    $('guest-panel').style.display = 'none';

    const el = $('map-list');
    el.innerHTML = ALL_MAPS.map(m =>
      '<div class="map-card ' + (room.map_id === m.id ? 'selected' : '') + '" onclick="selectMap(\'' + m.id + '\')">' +
        '<div class="mn">' + m.name + '</div>' +
        '<div class="mt">' + m.tags + '</div>' +
      '</div>'
    ).join('');

    const canStart = room.host_tank && room.guest_tank && room.map_id;
    $('btn-start').disabled = !canStart;
    $('btn-start').textContent = canStart ? '▶ 开始战斗' : '⏳ 等待双方准备完毕';
  } else {
    $('host-panel').style.display = 'none';
    $('guest-panel').style.display = 'block';
  }
}

async function selectMap(mapId) {
  myMapId = mapId;
  renderRoomControls(true, Object.assign({}, currentRoom, { map_id: mapId }));
  try {
    await api('/api/online/select-tank', {
      method: 'POST',
      body: JSON.stringify({ roomId: currentRoom.id, tank: myTank || currentRoom.host_tank || 'basic', mapId: mapId })
    });
    toast('已选择地图');
  } catch (e) { toast(e.message, true); }
}

async function startBattle() {
  try {
    await api('/api/online/start', { method: 'POST', body: JSON.stringify({ roomId: currentRoom.id }) });
    toast('战斗开始！');
    clearInterval(pollTimer);
    pollTimer = null;
    setTimeout(() => {
      window.location.href = 'index.html?online=1&room=' + encodeURIComponent(currentRoom.id);
    }, 400);
  } catch (e) { toast(e.message, true); }
}

async function leaveRoom(silent) {
  if (currentRoom && !silent) {
    if (!confirm('确定离开房间？')) return;
    try { await api('/api/online/leave', { method: 'POST', body: JSON.stringify({ roomId: currentRoom.id }) }); } catch (e) {}
  }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  currentRoom = null;
  myTank = null;
  myMapId = null;
  $('view-lobby').style.display = 'block';
  $('view-room').style.display = 'none';
  loadRoomList();
}

boot();
</script>
</body>
</html>
